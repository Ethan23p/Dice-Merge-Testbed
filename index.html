<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dice Merge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="scoreboard">
    <div class="score" id="score">0</div>
    <div class="best" id="best-score">Best 0</div>
  </header>

  <div class="board-shell">
    <div class="board" id="board" role="grid" aria-label="Dice board"></div>
  </div>

  <div class="queue" aria-label="Upcoming pieces">
    <span class="queue-label">Drag to place · tap to rotate</span>
    <div class="piece-slot" id="current-piece"></div>
    <div class="piece-slot piece-slot--next" id="next-piece"></div>
  </div>

  <footer class="toolbar">
    <button class="icon-button" id="config-toggle-btn" type="button" aria-label="Tuning panel">
      <span class="icon-circle">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M4 6h10M17 6h3M4 12h3M9 12h11M4 18h13M20 18h0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="14" cy="6" r="2.2" fill="currentColor"/>
          <circle cx="6" cy="12" r="2.2" fill="currentColor"/>
          <circle cx="16.5" cy="18" r="2.2" fill="currentColor"/>
        </svg>
      </span>
      <span class="icon-label">Tuning</span>
    </button>

    <button class="icon-button" id="menu-btn" type="button">
      <span class="icon-circle icon-circle--ghost">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="icon-label">Menu</span>
    </button>
  </footer>
</div>

<!-- Pinned config rows float over the game, anchored to the bottom,
     growing upward, bounded so they can never reach the staging area
     or board no matter how many are pinned (see .pinned-config). -->
<div class="pinned-config" id="pinned-config" hidden></div>

<!-- Second screen, laid over the game. Sits below the Tuning panel and its
     button so Tuning stays reachable from here. Cards are built by menu.js. -->
<div class="menu" id="menu" hidden>
  <div class="menu-inner">
    <header class="menu-hero">
      <div class="menu-dice" id="menu-dice" aria-hidden="true"></div>
      <h1 class="menu-title">Dice Merge</h1>
    </header>
    <button class="menu-continue" id="menu-continue" type="button" hidden></button>
    <div class="mode-list" id="mode-list"></div>
  </div>
</div>

<div class="game-over" id="game-over" hidden>
  <div class="game-over-card">
    <h2>Game Over</h2>
    <p>Score: <span class="final-score" id="game-over-score">0</span></p>
    <button class="btn-primary" id="play-again-btn" type="button">Play Again</button>
    <button class="btn-primary btn-primary--ghost" id="game-over-menu-btn" type="button">Menu</button>
  </div>
</div>

<!-- Full-screen tuning panel. Body is a flat scrollable list of every
     config row; the island up top holds every action button (global
     and pinned-only) — rows themselves carry no buttons but their own
     pin toggle. -->
<div class="config-panel" id="config-panel" hidden>
  <div class="config-island" id="config-island">
    <div class="config-island-group">
      <span class="config-island-label">All</span>
      <button class="config-btn" id="cfg-set-all-default" type="button">Set current as default</button>
      <button class="config-btn" id="cfg-reset-all-initial" type="button">Reset to initial</button>
      <button class="config-btn" id="cfg-reset-all-default" type="button">Reset to default</button>
    </div>
    <div class="config-island-group">
      <span class="config-island-label">Pinned only</span>
      <button class="config-btn" id="cfg-set-pinned-default" type="button">Set current as default</button>
      <button class="config-btn" id="cfg-reset-pinned-initial" type="button">Reset to initial</button>
      <button class="config-btn" id="cfg-reset-pinned-default" type="button">Reset to default</button>
    </div>
    <div class="config-island-group">
      <button class="config-btn" id="config-export-btn" type="button">Export config</button>
    </div>
  </div>
  <p class="config-note" id="config-mode-note" hidden></p>
  <div class="config-body" id="config-body"></div>
</div>

<script src="src/data.js"></script>
<script src="src/config.js"></script>
<script src="src/modes.js"></script>
<script src="src/state.js"></script>
<script src="src/render.js"></script>
<script src="src/physics.js"></script>
<script src="src/animate.js"></script>
<script src="src/panel.js"></script>
<script src="src/menu.js"></script>
<script src="src/main.js"></script>
</body>
</html>
